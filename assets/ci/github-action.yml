name: openspec-matt
on:
  pull_request:
  push:
    branches: [main]
jobs:
  golden-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails on spec format, duplicate ADR numbers and duplicate story names; warns on size.
      - run: npx -y openspec-matt@0 lint
